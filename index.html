<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liquid Glass Camera</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0c">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation;background:#000;color:#fff;overflow:hidden;font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",system-ui,sans-serif}
:root{--a:.146;--bl:19px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#0a0a0c}
#stage{position:absolute;inset:0;overflow:hidden;border-radius:60px;transition:border-radius .9s cubic-bezier(.3,1.3,.5,1)}
#stage.open{border-radius:0}
#v{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .6s}
.glass{position:relative;background:rgba(255,255,255,var(--a));-webkit-backdrop-filter:blur(var(--bl)) saturate(190%) brightness(1.08);backdrop-filter:blur(var(--bl)) saturate(190%) brightness(1.08);border:1px solid rgba(255,255,255,.28);box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.55),inset -1px -1px 1px rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.28)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.34),transparent 38%,transparent 68%,rgba(255,255,255,.12))}
button,a{font:inherit;color:#fff;cursor:pointer;text-shadow:0 1px 6px rgba(0,0,0,.35);touch-action:manipulation}
#grid,#mask,#fx,#cd,#scrim{position:absolute;inset:0;pointer-events:none}
#grid{opacity:0;transition:opacity .3s;background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:100% 33.333%,33.333% 100%}
.grid #grid{opacity:1}
#mask{inset:auto 0;top:50%;aspect-ratio:1;transform:translateY(-50%);box-shadow:0 0 0 200vmax rgba(0,0,0,.62);opacity:0;transition:opacity .4s}
.sq #mask{opacity:1}
#focus{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border:1.5px solid #ffd60a;border-radius:20px;opacity:0;pointer-events:none}
#cd{display:grid;place-items:center;font:700 150px ui-rounded,-apple-system,sans-serif;opacity:0;text-shadow:0 6px 40px rgba(0,0,0,.45)}
#fx{background:#fff;opacity:0}
#scrim{background:rgba(0,0,0,.38);opacity:0;transition:opacity .35s}
.sc #scrim{opacity:1;pointer-events:auto}
.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;margin:0 auto;width:max-content;display:flex;gap:4px;padding:6px;border-radius:32px}
.ib{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;z-index:1}
.top .ib{border:0;background:none}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:#ffd60a;color:#000;text-shadow:none}
.ib.off{opacity:.42}
.ib b{position:absolute;right:4px;bottom:3px;font-size:10px}
#flip svg{transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
#rb2{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 74px);left:0;right:0;margin:0 auto;width:max-content;padding:6px 14px;border-radius:20px;background:#ff453a;font:700 14px ui-rounded,sans-serif;font-variant-numeric:tabular-nums;display:none;z-index:7}
.rec #rb2{display:block}
.bottom{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
.bottom>*{pointer-events:auto}
.zoom{display:flex;gap:4px;padding:5px;border-radius:30px}
.zoom button{width:42px;height:42px;border-radius:50%;border:0;background:none;font-weight:700;font-size:13px;z-index:1}
.zoom .on{color:#ffd60a;background:rgba(0,0,0,.3)}
.modes{display:flex;padding:5px;border-radius:30px}
.modes button{position:relative;z-index:1;padding:11px 18px;border:0;background:none;border-radius:24px;font-weight:600;font-size:14px}
.modes .on{color:#ffd60a}
#ind{position:absolute;top:5px;bottom:5px;border-radius:24px;background:rgba(255,255,255,.26);box-shadow:inset 1px 1px 1px rgba(255,255,255,.5)}
.ctrl{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 34px}
#thumb{width:58px;height:58px;border-radius:19px;overflow:hidden;padding:0}
#thumb>*{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
#shut{width:82px;height:82px;border-radius:50%;padding:7px}
#shut span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.vid #shut span{background:#ff453a}
.rec #shut span{border-radius:15px;transform:scale(.55)}
#flip{width:58px;height:58px;border-radius:50%}
.sheet{position:absolute;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));padding:22px;border-radius:38px;transform-origin:50% 100%;z-index:5}
.sheet[hidden],#gate[hidden]{display:none}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet label{display:block;margin:14px 0 0;font-weight:600}
.sheet label span{display:flex;justify-content:space-between}
.sheet output{opacity:.75;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:2px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:rgba(255,255,255,.35)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:rgba(255,255,255,.35)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 0 6px;background:none;border:0;font-weight:600;font-size:16px}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.3);transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .5s cubic-bezier(.34,1.8,.64,1)}
.sw.on{background:#30d158}
.sw.on::after{transform:translateX(22px)}
.pill{display:inline-block;padding:13px 20px;border-radius:24px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid rgba(255,255,255,.28)}
.pill.off{opacity:.42}
.done{width:100%;margin-top:12px;text-align:center}
#view{top:14px}
#view:not([hidden]){display:flex;flex-direction:column}
#vm{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;border-radius:26px}
#vm img,#vm video{max-width:100%;max-height:100%;border-radius:26px}
.vb{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
#gate{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:24px;background:#0a0a0c}
#gate div{padding:28px;border-radius:38px;text-align:center;max-width:320px}
#gate p{margin:0 0 18px;line-height:1.45}
#gate .pill{display:block;width:100%}
#toast{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 76px);left:0;right:0;margin:0 auto;width:max-content;max-width:86%;padding:10px 18px;border-radius:22px;font-weight:600;font-size:14px;z-index:10;opacity:0;pointer-events:none;text-align:center}
.rec #toast{top:calc(max(14px,env(safe-area-inset-top)) + 118px)}
#eng,#sheet{max-height:calc(100% - 28px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sec{margin:20px 0 2px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.6}
.sec:first-of-type{margin-top:10px;padding-top:0;border-top:0}
.seg{display:flex;padding:4px;border-radius:22px;margin-top:8px;background:rgba(0,0,0,.22)}
.seg button{flex:1;padding:10px 0;border:0;background:none;border-radius:18px;font-weight:700;font-size:14px}
.seg .on{background:rgba(255,255,255,.26);color:#ffd60a;box-shadow:inset 1px 1px 1px rgba(255,255,255,.5)}
#info{margin:14px 0 0;font-size:12.5px;line-height:1.55;opacity:.74;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){#v,#stage{transition:none}}

/* ---------- 4D tilt parallax + depth of field ---------- */
#app{perspective:1100px}
#depthFx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
  -webkit-backdrop-filter:blur(var(--dbl,10px)) saturate(106%);backdrop-filter:blur(var(--dbl,10px)) saturate(106%);
  -webkit-mask-image:radial-gradient(ellipse 46% 37% at 50% 46%,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 44%,rgba(0,0,0,.5) 70%,#000 100%);
  mask-image:radial-gradient(ellipse 46% 37% at 50% 46%,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 44%,rgba(0,0,0,.5) 70%,#000 100%)}
.depth #depthFx{opacity:1}
.par .glass::after{background:linear-gradient(135deg,rgba(255,255,255,.34),transparent 38%,transparent 68%,rgba(255,255,255,.12)),radial-gradient(circle at var(--lx,50%) var(--ly,26%),rgba(255,255,255,.28),rgba(255,255,255,0) 60%)}
#eng .sub{font-size:12.5px;opacity:.6;margin:6px 0 0;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><video id="v" playsinline muted autoplay></video></div>
  <div id="depthFx"></div>
  <div id="grid"></div><div id="mask"></div><div id="focus"></div><div id="cd"></div><div id="fx"></div>

  <div class="top glass">
    <button class="ib g" id="bF" aria-label="Flash" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M13 2 5 13h6l-1 9 8-12h-6z"/></svg></button>
    <button class="ib g" id="bG" aria-label="Grid" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg></button>
    <button class="ib g" id="bT" aria-label="Timer" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><b id="tl"></b></button>
    <button class="ib g" id="bE" aria-label="Capture engine"><svg viewBox="0 0 24 24"><path d="M11 3l2 5.5L18.5 10.5 13 12.5 11 18l-2-5.5L3.5 10.5 9 8.5zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></button>
    <button class="ib g" id="bS" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </div>
  <div id="rb2">● <span id="rt">00:00</span></div>
  <div id="toast" class="glass" role="status" aria-live="polite"></div>

  <div class="bottom">
    <div class="zoom glass" id="zoom"><button class="g on" data-z="1">1×</button><button class="g" data-z="2">2×</button><button class="g" data-z="3">3×</button></div>
    <div class="modes glass" id="modes"><i id="ind"></i><button class="g" data-m="video">Video</button><button class="g on" data-m="photo">Photo</button><button class="g" data-m="square">Square</button></div>
    <div class="ctrl">
      <button class="g glass" id="thumb" aria-label="Last capture"></button>
      <button class="g glass" id="shut" aria-label="Shutter"><span></span></button>
      <button class="g glass ib" id="flip" aria-label="Flip camera"><svg viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-2L4 8M4 3v5h5M4 16a8 8 0 0 0 14 2l2-2M20 21v-5h-5"/></svg></button>
    </div>
  </div>

  <div id="scrim"></div>

  <section class="sheet glass" id="sheet" hidden aria-label="Settings">
    <h2>Settings</h2>
    <div class="sec">Glass &amp; motion</div>
    <label><span>Transparency <output id="ot"></output></span><input type="range" id="rT" min="0" max="100" value="55"></label>
    <label><span>Bounce <output id="ob"></output></span><input type="range" id="rB" min="0" max="100" value="60"></label>
    <button class="g row" id="snd">Water sound <i class="sw on"></i></button>
    <div class="sec">4D &amp; depth</div>
    <button class="g row" id="t4d">4D tilt parallax <i class="sw on"></i></button>
    <label><span>Parallax strength <output id="op">1.0&times;</output></span><input type="range" id="rP" min="0" max="100" value="60"></label>
    <button class="g row" id="eDepth">Depth effect <i class="sw on"></i></button>
    <label><span>Depth strength <output id="od">70%</output></span><input type="range" id="rD" min="0" max="100" value="70"></label>
    <button class="g glass pill done" id="sdone">Done</button>
  </section>

  <section class="sheet glass" id="eng" hidden aria-label="Capture engine">
    <h2>Capture engine</h2>
    <div style="font-weight:600;margin-top:12px">Quality</div>
    <div class="seg" id="qseg"><button class="g on" data-q="max">Max</button><button class="g" data-q="high">High</button><button class="g" data-q="std">Standard</button></div>
    <button class="g row" id="eBurst">Best-shot burst <i class="sw on"></i></button>
    <button class="g row" id="eSharp">Detail boost <i class="sw on"></i></button>
    <button class="g row" id="eAF">Tap to focus &amp; expose <i class="sw on"></i></button>
    <p id="info"></p>
    <button class="g glass pill done" id="edone">Done</button>
  </section>

  <section class="sheet glass" id="view" hidden aria-label="Captured media">
    <div id="vm"></div>
    <div class="vb">
      <button class="g glass pill" id="vp" aria-label="Previous">‹</button>
      <button class="g glass pill" id="vc">Close</button>
      <a class="g glass pill" id="vs" download>Save</a>
      <button class="g glass pill" id="vn" aria-label="Next">›</button>
    </div>
  </section>

  <div id="gate" hidden><div class="glass"><p id="gm">Camera access is needed.</p><button class="g glass pill" id="gb">Allow camera</button><button class="g glass pill" id="gn" style="margin-top:10px">Use phone camera app</button></div></div>
  <input type="file" id="fi" hidden>
</div>

<script>
const $=(s,e=document)=>e.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const S={b:.6,snd:true,mode:'photo',tm:0,face:'environment',z:1,dz:1};
/* capture engine: quality presets (stream request, JPEG quality, video cap + bitrate) */
const E={q:'max',burst:true,sharp:true,af:true};
/* 4D parallax + depth of field */
const D={par:true,depth:true,k:.7};
const QP={max:{w:7680,h:4320,jpg:.98,vmax:3840,vbr:28e6},high:{w:3840,h:2160,jpg:.94,vmax:1920,vbr:14e6},std:{w:1920,h:1080,jpg:.88,vmax:1280,vbr:6e6}};
const app=$('#app'),v=$('#v'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let stream=null,torchOK=false,torchOn=false,rec=null,chunks=[],micS=null,rtimer=null,items=[],vi=0,openS=null,prev=null,flipR=0,busy=false,pipe=null;
if(matchMedia('(prefers-reduced-motion:reduce)').matches){S.b=.1;$('#rB').value=10;D.par=false}

/* ---------- spring ---------- */
function sp(b,n=44){const z=.95-b*.78,w=15,wd=w*Math.sqrt(1-z*z),T=.55+b*.7,p=[];
  for(let i=0;i<=n;i++){const t=i/n*T;p.push(1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t)))}
  p[n]=1;return{p,T}}
/* The spring curve is a pure function of the bounce value, and the same
   endpoint pairs are replayed over and over — every control tap runs
   spr(g,{s:.88},{s:1},{k:50}), every capture runs spr(#stage,{s:.96},{s:1}),
   every toast runs the same two sets — yet each call re-sampled the 45-point
   curve (45 exp/cos/sin) and rebuilt 45 keyframe objects with two template
   strings each: ~0.38 ms of main-thread work and ~90 string allocations per
   bounce, right where the tap animation is supposed to start. Sample once per
   bounce value, build each keyframe set once, and hand the same array to
   el.animate() (which copies it) — identical keyframes, identical motion. */
let spB=NaN,spR=null;
const kfCache=new Map();
function spC(){if(S.b!==spB){spB=S.b;spR=sp(S.b);kfCache.clear()}return spR}
/* 45 evenly spaced samples are far more than a smooth spring needs. The browser
   resolves every one of them — parse the transform, set up the interpolation —
   at ~45 µs each, so a bounce spends ~1.4 ms on keyframes that a handful of
   straight segments could draw identically. Drop the interior samples whose
   removal keeps every discarded point within 0.35 px (and 0.01 opacity) of the
   line the browser would draw between the survivors: the piecewise-linear curve
   the compositor walks is unchanged to well under half a pixel, and no surviving
   keyframe moves in time because offsets are written out explicitly (i/n, which
   is exactly the implicit even spacing the array had before). */
const KF_TOL=.35,KF_REF=800,KF_OP=.01;
function pruneKf(a,b,k,p){
  const n=p.length-1,c=x=>Math.min(1,Math.max(0,x));
  const ao=a.o??1,bo=b.o??1;
  const dY=Math.abs((b.y||0)-(a.y||0)),dS=Math.abs(b.s-a.s)*KF_REF;
  const oAt=i=>ao+(bo-ao)*c(i/n*k);
  const ok=(i0,i1,m)=>{const u=(m-i0)/(i1-i0);
    const dx=Math.abs(p[m]-(p[i0]+(p[i1]-p[i0])*u));
    return dx*dY<=KF_TOL&&dx*dS<=KF_TOL&&Math.abs(oAt(m)-(oAt(i0)+(oAt(i1)-oAt(i0))*u))<=KF_OP};
  const keep=[0];let i0=0;
  while(i0<n){let j=i0+1;
    while(j<n){let good=true;for(let m=i0+1;m<=j;m++)if(!ok(i0,j+1,m)){good=false;break}
      if(!good)break;j++}
    keep.push(j);i0=j}
  return keep}
function kfFor(a,b,k){const p=spC().p;/* also drops the cache when the bounce value changed */
  const key=a.s+'|'+(a.y||0)+'|'+(a.o??1)+'|'+b.s+'|'+(b.y||0)+'|'+(b.o??1)+'|'+k;
  const hit=kfCache.get(key);if(hit)return hit;
  const n=p.length-1,c=x=>Math.min(1,Math.max(0,x));
  const kf=pruneKf(a,b,k,p).map(i=>{const x=p[i],s=a.s+(b.s-a.s)*x,y=(a.y||0)+((b.y||0)-(a.y||0))*x,oo=(a.o??1)+((b.o??1)-(a.o??1))*c(i/n*k);
    return{offset:i/n,transform:`translateY(${y}px) scale(${s})`,opacity:oo}});
  if(kfCache.size>24)kfCache.clear();
  kfCache.set(key,kf);return kf}
const sprAnims=new WeakMap();
function spr(el,a,b,o={}){if(!el)return;const{T}=spC();
  const prevA=sprAnims.get(el);if(prevA){try{prevA.onfinish=null;prevA.cancel()}catch(e){}}
  const kf=kfFor(a,b,o.k||6);
  const an=el.animate(kf,{duration:T*1000,delay:o.d||0,easing:'linear',fill:'both'});
  sprAnims.set(el,an);
  an.onfinish=()=>{if(o.end)o.end();try{an.cancel()}catch(e){}};return an}

/* Element.getAnimations() landed in Chrome 84, four years after el.animate()
   (Chrome 36), so an older WebView has animate() but no getAnimations(). All
   five call sites below reached for it unguarded, and every one of them is on a
   hot path: the first line of snap() cancels the focus/flash ring, so on such a
   WebView the shutter threw before it ever read a frame and no photo could be
   taken at all; toast() threw before it could show anything, so the capture,
   timer, zoom, flash and recording messages were all silent; and moveInd threw
   on every mode switch and resize, leaving the indicator behind. Cancel through
   one guarded helper instead — identical behaviour where the API exists, no
   throw where it does not. */
function killAnims(el){if(!el||typeof el.getAnimations!=='function')return;
  let l;try{l=el.getAnimations()}catch(e){return}
  for(const a of l)try{a.cancel()}catch(e){}}

/* ---------- water sound ---------- */
/* plop() created one AudioContext on the first tap and then left it running for
   the rest of the session. A running context keeps the audio output stream open,
   so the device's audio hardware never idles down between the ~0.2 s blips this
   app plays — on a phone that is the audio DSP and its clock held awake for the
   whole time the camera is open, for silence. It is suspended once the sound it
   was started for has finished and immediately when the page is hidden, and
   plop() resumes it for the next tap (the resume happens inside the pointerdown
   that caused it, so it is still a user gesture). The idle window is longer than
   the countdown's 1 s tick, so a running timer keeps the context awake across
   its own beeps instead of suspending and resuming once a second. */
let AC,acIdle=0;
function acSuspend(){clearTimeout(acIdle);acIdle=0;
  try{if(AC&&AC.state==='running'){const p=AC.suspend();if(p&&p.catch)p.catch(()=>{})}}catch(e){}}
addEventListener('visibilitychange',()=>{if(document.hidden)acSuspend()});
function plop(){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{})}
  clearTimeout(acIdle);acIdle=setTimeout(acSuspend,1200);
  const t=AC.currentTime,r=Math.random();
  const bub=(d,f0,f1,vol,len)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
    o.frequency.setValueAtTime(f0,t+d);o.frequency.exponentialRampToValueAtTime(f1,t+d+len*.7);

/* ---------- 4D tilt parallax ---------- */
const PAR={on:true,k:1,ax:0,ay:0,tx:0,ty:0,base:null,raf:0,pt:0,listening:false,gyro:false};
const PL=[['.top',18],['#zoom',13],['#modes',11],['.ctrl',9],['#stage',-7],['#toast',20],['#rb2',16]];
let PLc=null;
function parLayers(){if(!PLc)PLc=PL.map(([s2,d])=>[$(s2),d]);return PLc}
function parApply(){
  for(const [el,d] of parLayers())if(el)el.style.translate=(PAR.tx*d).toFixed(2)+'px '+(PAR.ty*d).toFixed(2)+'px';
  document.documentElement.style.setProperty('--lx',(50+PAR.tx*44).toFixed(1)+'%');
  document.documentElement.style.setProperty('--ly',(26+PAR.ty*34).toFixed(1)+'%');
}
function parReset(){for(const [el] of parLayers())if(el)el.style.translate='0px 0px';
  document.documentElement.style.setProperty('--lx','50%');
  document.documentElement.style.setProperty('--ly','26%')}
function parKick(){if(!PAR.on||PAR.raf)return;PAR.raf=requestAnimationFrame(parLoop)}
/* The smoothing step was a flat 0.14 per frame, so how long the layers took to
   settle was set by how often the display calls back rather than by time: the
   same 20 frames is 333 ms at 60 Hz, 222 ms at 90 Hz and 167 ms at 120 Hz — on
   a 120 Hz phone the parallax snapped to the tilt in half the time it was
   tuned for, and a WebView that fell to 30 fps dragged the same move out to
   667 ms. The step is scaled by the frame's own interval, normalised to a
   60 Hz frame so an ordinary 60 Hz cadence steps by exactly the same 0.14 and
   nothing about the motion changes there; the interval is clamped at 50 ms so
   the first frame after a long pause eases in instead of jumping, and it is
   dropped when the loop parks so a later kick starts fresh.
   Measured with a virtual animation clock, frames to settle: 60 Hz 20 (333 ms)
   and 120 Hz 20 (167 ms) before, 20 (333 ms) and 40 (334 ms) after. */
function parLoop(t){
  PAR.raf=0;
  const tx=PAR.ax*PAR.k,ty=PAR.ay*PAR.k;
  const ok=typeof t==='number'&&isFinite(t);
  const dt=ok&&PAR.pt>0?Math.min(50,Math.max(1,t-PAR.pt)):16.7;
  PAR.pt=ok?t:0;
  const f=1-Math.pow(1-.14,dt/16.7);

  parApply();
  if(Math.abs(tx-PAR.tx)>.0015||Math.abs(ty-PAR.ty)>.0015)PAR.raf=requestAnimationFrame(parLoop);
  else PAR.pt=0;
}
const clampP=v=>Math.max(-1,Math.min(1,v));
/* The gyro subscription outlived the setting it exists for. enableTilt() is
   armed on the first tap and `#t4d` only flipped a flag, so with "4D tilt
   parallax" switched off — or with reduced motion, which turns it off at boot —
   the page kept a `deviceorientation` listener for the rest of the session. That
   listener is what keeps the device's rotation-vector sensor (gyro and
   accelerometer, plus the fusion between them) sampling at the platform's event
   rate for as long as the camera is open, and every event it delivered still ran
   onTilt()'s maths only for parKick() to drop the result on the floor, because
   PAR.on was false. The subscription now follows the setting: dropped the moment
   parallax is switched off, taken up again when it is switched back on — from the
   toggle's own click, so the iOS permission prompt is still raised inside a user
   gesture — and a permission grant that lands after the setting was turned off is
   not acted on. Nothing on screen changes: with 4D off the layers are already
   parked at their rest position and the tilt handler already had no effect. */
function onTilt(e){
  if(!PAR.on)return;
  if(e.beta==null&&e.gamma==null)return;
  const b=e.beta||0,g=e.gamma||0;
  if(!PAR.base)PAR.base={b,g};
  const db=Math.max(-40,Math.min(40,b-PAR.base.b))/40;
  const dg=Math.max(-40,Math.min(40,g-PAR.base.g))/40;

function enableTilt(){

  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      /* Only 'denied' is a refusal. Chromium answers 'prompt' — it has no
         per-site prompt for the sensor and simply streams once a listener is
         attached — so requiring 'granted' meant 4D tilt never started there at
         all. Anything that is not 'denied' subscribes; if the platform really
         is holding the permission back, no events arrive and nothing is spent. */
      DeviceOrientationEvent.requestPermission().then(r=>{if(r!=='denied')start()}).catch(()=>{});

  PAR.ay=clampP((e.clientY-r.top)/r.height*2-1);

let parTouch=false;
/* The 4D and depth switches were placed by hand at every call site that set the
   flag — loadCfg() and the two toggles — and the one site that forgot was the
   boot default: `prefers-reduced-motion: reduce` turns parallax off before the
   first frame, but `#t4d .sw` kept the `on` class it is authored with, so the
   sheet showed "4D tilt parallax" switched on over a page with no `par` class,
   no tilt subscription and no parallax at all — the feature looked broken until
   the user tapped the already-on switch, which turned it on for real. The
   setters are the single point where the flag becomes state, so they place the
   switch too: a boot default, a restored preference and a tap all end up
   showing the state that is actually in effect. On a device without the
   reduced-motion preference nothing changes — D.par and D.depth already agreed

/* ---------- depth of field ---------- */
const dScratch=document.createElement('canvas');
function depthMask(g,w,h){
  const cx=w/2,cy=h*.46,r=Math.max(w,h)*.62;
  const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);
  gr.addColorStop(0,'rgba(0,0,0,0)');
  gr.addColorStop(.40,'rgba(0,0,0,0)');
  gr.addColorStop(.64,'rgba(0,0,0,.45)');
  gr.addColorStop(.92,'rgba(0,0,0,1)');
  gr.addColorStop(1,'rgba(0,0,0,1)');
  return gr;
}
function depthPass(ctx,canvas,k){
  const w=canvas.width,h=canvas.height;
  if(!w||!h||k<=0)return;
  const tw=Math.max(8,Math.round(w/5)),th=Math.max(8,Math.round(h/5));
  if(dScratch.width!==tw||dScratch.height!==th){dScratch.width=tw;dScratch.height=th}
  const b=dScratch.getContext('2d');
  if(!b)return;
  b.setTransform(1,0,0,1,0,0);
  b.globalCompositeOperation='source-over';
  b.globalAlpha=1;
  b.clearRect(0,0,tw,th);
  const blur=Math.max(.5,Math.min(8,(Math.min(w,h)/5/58)*(0.65+0.85*k)));
  try{b.filter='blur('+blur.toFixed(2)+'px)'}catch(e){}
  b.drawImage(canvas,0,0,tw,th);
  try{b.filter='none'}catch(e){}
  b.globalCompositeOperation='destination-in';
  b.fillStyle=depthMask(b,tw,th);
  b.fillRect(0,0,tw,th);
  b.globalCompositeOperation='source-over';
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  try{ctx.imageSmoothingQuality='high'}catch(e){}
  ctx.globalAlpha=Math.max(0,Math.min(1,k));
  ctx.drawImage(dScratch,0,0,w,h);
  ctx.restore();
}

/* ---------- camera ---------- */
const track=()=>stream&&stream.getVideoTracks()[0];
function vt(){v.style.transform=`scale(${(S.face==='user'?-1:1)*S.dz},${S.dz})`}
/* A camera can advertise `zoom` and still not move. The zoom is sent as an
   `advanced` constraint set, and the spec says a set the UA cannot satisfy is
   skipped rather than rejected — applyConstraints() resolves, nothing changes,
   and the row shows the tapped level while the preview and the capture both
   stay at 1× with nothing said about it: the same silent divergence the
   constraint-set fix below is about, from the other side. Read the zoom back
   off the track once the call settles, and only when the camera reports a zoom
   that did not move, fall back to the digital zoom this app already has so the
   tap always zooms. A camera that applies the zoom without reporting it in
   getSettings() reports no `zoom` at all and is left alone, a value within the
   camera's own step counts as applied, and `dig()` drops out if the track was
   replaced or a newer tap already set a digital zoom, so a late readback can
   never undo a newer one. A rejected apply is a refusal the caller already
   treats as "no hardware zoom" and keeps its own path. */
function applyZoom(){const t=track(),c=(t&&t.getCapabilities&&t.getCapabilities())||{};
  if(c.zoom){const z=Math.min(c.zoom.max,Math.max(c.zoom.min,S.z));S.dz=1;vt();
    const dig=()=>{if(!t||track()!==t||S.dz!==1)return;S.dz=S.z;vt()};
    t.applyConstraints({advanced:modeAdv(c).concat([{zoom:z}])}).then(()=>{
      if(track()!==t)return;
      let st;try{st=t.getSettings&&t.getSettings()}catch(e){st=null}
      if(!st||st.zoom==null)return;
      if(Math.abs(st.zoom-z)>Math.max(.01,(c.zoom.step||0)/2))dig()}).catch(()=>{})

   constraint set this app wrote after applyZoom() — the resolution bump and the
   focus/exposure/white-balance pass in tune(), the single-shot focus a tap on
   the preview asks for and its 3 s restore, and the torch toggle — silently

   put down, so the shutter stayed in the recording state and the red pill stayed
   on screen for the whole encode: tapping stop measured 308 ms to the UI leaving
   the recording state on the fake device, and not one frame was painted in
   between — the poster was encoded, then the take was ended, then the clip
   appeared, all in the same frame. The frame is grabbed now (cheap, while the

   "data:," rather than throwing — a truthy string that would put a broken image
   in the thumb — so an encode of a surface that is gone is no poster at all. */
function posterEncode(){try{return pScratch.width&&pScratch.height?pScratch.toDataURL('image/jpeg',.72):''}catch(e){return''}}
function posterFrom(c){return posterGrab(c)?posterEncode():''}
/* dScratch (the depth pass) and pScratch (the poster) are module-level surfaces
   like stillC and pipeC, but unlike them they were never released: a 12 MP
   frame leaves ~5 MB of RGBA in dScratch and a 1080-long-edge poster ~6 MB in
   pScratch, both pinned for as long as the WebView stays alive after the page
   is hidden. Neither is used while the page is hidden, and both re-check their
   size on every call, so zeroing them frees the backing store and the next
   depth pass or poster just resizes. */
addEventListener('visibilitychange',()=>{if(document.hidden){dScratch.width=dScratch.height=0;pScratch.width=pScratch.height=0}});
/* The recording surface was a brand new canvas per take, sized to the quality
   preset (up to 3840×2160 at Max, a 33 MB backing store), and it was created on
   the tap that starts recording — the very moment the shutter has to paint its
   recording state and the toast. Allocating and first-touching a surface that
   size is not free (a fresh 4K canvas costs ~100–170 ms here against ~20 ms to
   draw into one that already exists, the same allocation the still capture path
   was fixed for), and it was thrown away again when the take ended. One surface
   is now reused across takes and only resized when the recording size actually
   changes; draw() paints the first frame into it before captureStream() is
   attached, so nothing from the previous take can be recorded. It is released
   when the page is hidden so nothing is pinned while the camera sits in the
   background — but never during a take, whose stream is attached to it. */
let pipeC=null;
function pipeCanvas(w,h){
  if(!pipeC){try{pipeC=document.createElement('canvas')}catch(e){return null}}
  if(pipeC.width!==w||pipeC.height!==h){pipeC.width=w;pipeC.height=h}
  return pipeC}
addEventListener('visibilitychange',()=>{if(document.hidden&&pipeC&&!rec){pipeC.width=pipeC.height=0;pipeC=null}});
function makePipe(){
  const r=cropRect();if(!r)return null;
  const scale=Math.min(1,QP[E.q].vmax/Math.max(r.sw,r.sh));
  const w=Math.max(2,Math.round(r.sw*scale)&~1),h=Math.max(2,Math.round(r.sh*scale)&~1);
  const c=pipeCanvas(w,h);if(!c)return null;
  const ctx=c.getContext('2d',{alpha:false});
  if(!ctx||!c.captureStream)return null;
  let cs;try{cs=c.captureStream(30)}catch(e){return null}
  let live=true,raf=0,last=performance.now();
  /* The canvas the take is captured from was written twice per frame whenever
     the depth effect was on: drawCrop() painted the frame, then depthPass()
     painted the blurred layer over it. A 2D canvas with a live captureStream()
     hands the pipeline a frame on every write, so a depth-on take fed it two
     frames a tick where it needs one, and the frames the encoder could not
     take queued up unread at 8.9 MB apiece. Measured on the 1028 × 2160 pipe
     the Max preset makes from a 4K sensor: with depth on the browser's
     resident size climbed ~600 MB/s and it was killed inside a second, while
     the same take with depth off — one write a frame — settled at 1.26 GB and
     ran to the end. The layer is composed on a scratch surface and blitted
     into the captured canvas once per frame instead, so what the encoder is
     handed is identical (a 1:1 copy of the same opaque composite, no resample)
     and the pipeline sees one frame a tick. The scratch surface is pipe-sized,
     reused across frames, and let go with the pipe; a device where it cannot
     be created falls back to the two-write path unchanged. */
  let offC=null,offX=null;
  const off=(W,H)=>{if(!offC){try{offC=document.createElement('canvas')}catch(e){return null}}
    if(offC.width!==W||offC.height!==H){offC.width=W;offC.height=H;offX=null}
    if(!offX){try{offX=offC.getContext('2d',{alpha:false})}catch(e){offX=null}}
    return offX?offC:null};
  const draw=()=>{const q=cropRect();if(!q)return;
    if(D.depth){const o=off(w,h);
      if(o){drawCrop(offX,o,q,w,h,S.face==='user');try{depthPass(offX,o,D.k)}catch(e){}
        ctx.drawImage(o,0,0);return}}
    drawCrop(ctx,c,q,w,h,S.face==='user');
    if(D.depth){try{depthPass(ctx,c,D.k)}catch(e){}}};
  draw();
  /* the capture stream asks for 30 fps, so drawing faster than that only burns
     GPU/battery: skip frames that arrive before the next 1/30 s slot is due */
  const STEP=1000/30-1;
  const loop=t=>{if(!live)return;if(t-last>=STEP){last=t;draw()}raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  return{stream:cs,grab:()=>posterGrab(c),
    stop:()=>{live=false;cancelAnimationFrame(raf);cs.getTracks().forEach(t=>t.stop());
      if(offC){offC.width=offC.height=0;offC=null;offX=null}}}}

/* MediaRecorder.stop() marks the recorder inactive and posts a stop task, but
   nothing guarantees that task runs: a wedged media pipeline in a WebView can
   swallow the event, leaving `rec` non-null for good. The shutter then thinks a
   take is still running — the UI stays in the recording state, the capture pipe
   keeps drawing its canvas every frame and the mic stays open — until the app
   is restarted. Finish the take from the chunks we already have, exactly once,
   whether the event arrives or a watchdog gets there first. */
let recWatch=0;
/* `chunks` is emptied when the take is finalised or abandoned and reassigned
   when the next one starts, so before that the part-Blobs of the take that just
   finished stayed referenced for the rest of the session —
   the finished clip's Blob holds its own reference to that data, so dropping the
   array frees nothing that is still needed, while keeping it pinned every byte
   MediaRecorder handed us (~210 MB for a 60 s take at the Max-quality 28 Mbps
   bitrate) even after the clip has been evicted from `items` and its object URL
   revoked. Release them as soon as the take is finalised or abandoned. */
function cleanupRec(){clearTimeout(recWatch);recWatch=0;clearInterval(rtimer);rtimer=null;app.classList.remove('rec');
  if(pipe){pipe.stop();pipe=null}
  if(micS){micS.getTracks().forEach(t=>t.stop());micS=null}
  chunks.length=0;
  /* The recorder of the take that is ending was left attached to the page. A
     take finalised by one of the watchdogs — the two paths that exist exactly
     for a pipeline that may not deliver its `stop` — is put down while the
     recorder is still alive, and its handlers stay on: `ondataavailable`
     pushes into `chunks`, which by then belongs to the *next* take. Measured
     here on the fake 4K device: a take whose stop() posted nothing was
     finalised by the error watchdog (0 items, "Nothing was recorded"), the
     next take was started, and one late flush from the finished recorder put
     its 100-byte part into that take's chunk list — `chunks` went from 1 part
     to 2, with the dead take's bytes in it. What the user would get is a clip
     whose header and first fragments belong to a different take. Detach the
     handlers and stop the recorder here, so a take that has been put down can
     never hand anything to the one that follows it; a recorder that is already
     inactive throws on stop() and is left exactly as it was. The handlers
     below also check that they are still the current recorder, for the window
     between a finalise and this detach. */
  const rr=rec;rec=null;
  if(rr){try{rr.ondataavailable=rr.onstop=rr.onerror=null}catch(e){}try{rr.stop()}catch(e){}}}
/* A take ends in the order the user is waiting on now: the frame for the poster
   is copied off the recording canvas, the take is put down (`cleanupRec()` — the
   shutter back to its round state, the red pill gone, the pipe and the
   microphone released), and only then, one painted frame later, are the clip's
   Blob and the poster built — so the tap is answered on screen before any of
   that work runs instead of after it.
   The Blob is the larger of those two jobs, and it is the one that used to run
   first. `new Blob(parts)` copies every byte MediaRecorder handed over — ~1 ms
   per MB, measured here: 19 ms for a 4 MB take, 103 ms at 50 MB, 222 ms at the
   210 MB a 60 s Max-quality take makes — and it ran before `cleanupRec()`, so
   the shutter stayed in its recording state and the red pill stayed on screen
   for the whole copy: 222 ms of main thread, 13 dropped frames, on the stop tap
   of a long take, for work the user is not waiting on. The poster encode was
   already moved out of that window (run 9/10); the copy in front of it was the
   bigger half. The take's parts are detached from `chunks` first, because
   `cleanupRec()` is what empties that array and the Blob is built from it
   afterwards, and the frame is already in pScratch, so nothing here depends on
   the take still being alive. A page hidden at that moment runs no frames at
   all, so the wait for one is skipped rather than waited out.
   What reaches the gallery is the same clip, byte for byte — the same parts, in
   the same order, in a Blob of the same type — and it still lands the same
   distance after the tap (a paint, the copy, the poster); only the point at
   which the take is put down has moved to the front of it. */
async function finishRec(rr){if(rec!==rr)return;
  const type=(rr.mimeType||'video/webm').split(';')[0];
  const grabbed=pipe?pipe.grab():false;
  const parts=chunks;chunks=[];      /* the take's own parts, detached before the take is put down */
  const ok=parts.length&&parts.some(c=>c.size);
  cleanupRec();
  if(!ok)return toast('Nothing was recorded');
  await nextPaint();
  const blob=new Blob(parts,{type:type});
  add({t:'v',u:URL.createObjectURL(blob),x:type.includes('mp4')?'mp4':'webm',p:grabbed?posterEncode():'',n:blob.size})}
function stopRec(){const rr=rec;if(!rr)return;
  recWatch=setTimeout(()=>{recWatch=0;finishRec(rr)},2000);
  try{rr.stop()}catch(e){finishRec(rr)}}
/* A MediaRecorder that fails fires `error`, then `dataavailable` with the rest
   of the take and then `stop` — the take is not over when the error arrives,
   it is one flush from over. The handler answered the error alone: it called
   `cleanupRec()` straight away, which emptied `chunks` and cleared `rec`, so
   the flush that followed found nothing to do — its slice was pushed into an
   array nobody would read again and its `stop` finalised nothing, because
   `finishRec()` bails when `rec` is no longer its recorder. A take that hit an
   encoder error at second 41 therefore lost the 40 s it had already recorded.
   Measured here on a 2 s Standard take with the error forced: `items` stayed
   empty, `rec` false, and the take's only chunk left dangling in `chunks`.
   Reading the chunks that exist at the error is not the answer either — the
   mp4 muxer this build prefers buffers its fragments and hands them over on
   the way out, so a blob built at the error holds a header and no frames and
   decodes to 0 × 0. End the take instead: `stop()` makes the recorder flush
   what it is holding, and the ordinary stop path finalises it, so what the
   user gets is the clip up to the error. A recorder that is already dead
   throws on `stop()` (or stays silent) and falls back to the same finalise
   with whatever exists, which is the "Nothing was recorded" answer the app
   already gives. The bound is shorter than a normal stop's: an errored
   pipeline is the one that may swallow the event, and the shutter should not
   sit in its recording state for two seconds over a take that has failed.
   Nothing on screen changes — the same message, and the shutter leaves the
   recording state exactly as it does on an ordinary stop. */
const REC_ERR_WAIT=1200;
function recoverRec(rr){if(rec!==rr)return;
  clearTimeout(recWatch);
  recWatch=setTimeout(()=>{recWatch=0;finishRec(rr)},REC_ERR_WAIT);
  try{rr.stop()}catch(e){finishRec(rr)}}

/* The take's microphone request is the one await in the recording path with no
   natural end, and the only one that holds the whole app. `busy` is set before
   the countdown and the mic is asked for inside the same try/finally, so the
   flag is released only once getUserMedia settles. A permission prompt that is
   never answered — dismissed by clicking beside it on a desktop browser, or a
   WebView whose permission request is dropped when its activity is torn down —
   leaves that promise pending for ever: `busy` stays true and the shutter,
   flip, zoom, mode, timer and record buttons all answer "Wait for the timer to
   finish" until the app is restarted. This is the same lock the takePhoto wait
   and the burst's frame wait were bounded for. The wait is bounded now, and how
   long it is depends on what the browser says about the permission: a granted
   microphone that has not opened in 5 s is a wedged audio HAL, while a prompt
   on screen is a person being asked — that one gets 20 s, so the bound only
   changes the outcome for a dialog nobody ever answered. A denied microphone is
   answered here instead of by a rejection round trip, and a stream that arrives
   after the bound has fired is stopped on arrival, so giving up can never leave
   the microphone open. What the take falls back to is the state the app already
   has for a missing mic: it records without sound. */
const MIC_WAIT=5000,MIC_ASK_WAIT=20000;
const stopTracks=s=>{try{s.getTracks().forEach(t=>{try{t.stop()}catch(e){}})}catch(e){}};
function micState(){try{
    const q=navigator.permissions&&navigator.permissions.query({name:'microphone'});
    if(q&&q.then)return q.then(s=>(s&&s.state)||'',()=>'');
  }catch(e){}
  return Promise.resolve('')}
async function micStream(){
  const st=await micState();
  if(st==='denied')throw Object.assign(new Error('microphone denied'),{name:'NotAllowedError'});
  const p=gum({audio:true});let t=0;
  return Promise.race([p,new Promise((_,no)=>{t=setTimeout(()=>{p.then(stopTracks,()=>{});no(new Error('mic timeout'))},st==='granted'?MIC_WAIT:MIC_ASK_WAIT)})])
    .then(s=>{clearTimeout(t);return s},e=>{clearTimeout(t);throw e})}

async function toggleRec(){
  if(rec){stopRec();return}
  if(busy)return cancelCd();
  if(!stream||!v.videoWidth)return toast('Camera is not ready yet');
  if(!window.MediaRecorder)return toast('Video recording is not supported here');
  busy=true;
  try{
    if(S.tm&&!(await countdown()))return;
    /* The tap waited for the take's two device jobs one after the other: the
       microphone request, and then the recording surface — a canvas
       allocation, its first full-size crop draw and captureStream(). They are
       independent and neither needs the other's result (a take with no sound
       still records from the same surface), so the surface is built while the
       microphone request is in flight and the shutter waits for the longer of
       the two instead of their sum. Measured on the fake 4K device, tap to the
       recording state, after the first take's cold permission prompt: 1907 ms
       and 1144 ms before against 1300 ms and 811 ms after, the remainder being
       the surface — which is what the tap now waits for — plus the recorder's
       construction. A surface that is built and then not used — the camera went
       away during the microphone wait, or the recorder could not be
       constructed — is stopped by the same `cleanupRec()` every other failure
       path already uses, so an abandoned take can never leave a capture loop
       running. */
    const micP=micStream();
    pipe=makePipe();
    let audioTracks=[];
    try{micS=await micP;audioTracks=micS.getAudioTracks()}catch(e){micS=null}
    const noMic=!audioTracks.length;
    if(!stream||!v.videoWidth){cleanupRec();return toast('Camera is not ready yet')}
    const vs=pipe?pipe.stream.getVideoTracks():stream.getVideoTracks();
    if(!vs.length){cleanupRec();return toast('Camera is not ready yet')}
    const st=new MediaStream([...vs,...audioTracks]);
    chunks=[];
    const mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
      .find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}});
    const rr=new MediaRecorder(st,Object.assign(mt?{mimeType:mt}:{},{videoBitsPerSecond:QP[E.q].vbr,audioBitsPerSecond:192000}));
    rec=rr;
    rr.ondataavailable=e=>{if(rec!==rr)return;if(e.data&&e.data.size)chunks.push(e.data)};
    rr.onerror=()=>{if(rec!==rr)return;toast('Recording stopped unexpectedly');recoverRec(rr)};
    rr.onstop=()=>finishRec(rr);
    rr.start(250);
    app.classList.add('rec');
    const t0=Date.now();$('#rt').textContent='00:00';
    rtimer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#rt').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
    spr($('#rb2'),{s:.6,y:-10,o:0},{s:1,y:0,o:1});
    if(noMic)toast('Recording without sound');
  }catch(e){cleanupRec();toast('Recording could not start')}
  finally{busy=false}
}

/* A countdown that is cancelled — or a shutter tap that finds no frame to
   capture — never reaches snap(), which is where a hide during the countdown
   hands the camera back (see the visibility handler). The camera it was holding
   for that countdown is released here instead, so a countdown that does not end
   in a capture can never pin the sensor behind a hidden page: the guard is the
   same `camHide` flag, so a capture that did run has already cleared it and
   this is a no-op. */
$('#shut').onclick=async()=>{
  if(!stream&&native)return pickNative();
  if(S.mode==='video')return toggleRec();
  if(busy)return cancelCd();
  busy=true;
  try{if(!v.videoWidth)return toast('Camera is not ready yet');if(S.tm&&!(await countdown()))return;await snap()}
  finally{busy=false;if(document.hidden&&camHide&&!capturing){camHide=false;dropCam()}}};

/* ---------- viewer ---------- */
/* The viewer swaps #vm's markup on every prev/next tap, and the outgoing <video>
   used to be dropped by that innerHTML write while it was still playing: the
   detached element keeps its blob source and its decoder buffers alive until it
   is garbage collected, and nothing guarantees it stays paused outside Blink.
   Tapping through a handful of clips therefore piled up dead players and their
   decoded frames. Pause it and release the source before the markup is
   replaced, so the decoder is freed on the spot. */
function stopViewMedia(){const m=$('#vm').querySelector('video');
  if(!m)return;
  try{m.pause()}catch(e){}
  try{m.removeAttribute('src');m.load()}catch(e){}}
function renderView(){const it=items[vi];if(!it)return;
  stopViewMedia();
  $('#vm').innerHTML=it.t==='i'?`<img src="${it.u}" alt="">`
    :`<video src="${it.u}" controls playsinline autoplay${it.p?` poster="${it.p}"`:''}></video>`;
  /* The poster is a ~55 KB base64 JPEG standing in for the clip's first frame,
     and it was kept on the item for the rest of the session even though nothing
     displays it once that frame has decoded — a fixed cost per recorded clip on
     top of the clip itself, and one that outlives the item's eviction. Drop the
     data URI the moment the frame it was covering is on screen, so the poster
     only ever exists while it is actually the picture being shown. */
  const m=$('#vm').querySelector('video');
  if(m&&it.p){const drop=()=>{it.p='';try{m.removeAttribute('poster')}catch(e){}};
    if(m.readyState>=2)drop();else m.addEventListener('loadeddata',drop,{once:true})}
  const s=$('#vs');s.href=it.u;s.download='camera-'+Date.now()+'.'+it.x;
  $('#vp').classList.toggle('off',vi<=0);$('#vn').classList.toggle('off',vi>=items.length-1)}
$('#thumb').onclick=()=>{if(!items.length)return toast('Nothing captured yet');vi=items.length-1;renderView();showSheet($('#view'))};
$('#vp').onclick=()=>{if(vi>0){vi--;renderView();spr($('#vm'),{s:.9},{s:1})}};
$('#vn').onclick=()=>{if(vi<items.length-1){vi++;renderView();spr($('#vm'),{s:.9},{s:1})}};
/* The app lets go of the camera, of its audio context and of every scratch
   surface when the page is hidden, but not of the clip the viewer is playing.
   A recorded take carries sound, so backgrounding the app left the clip's audio
   playing — and its decoder allocated — behind the home screen, for a page
   nobody can see: the same cost the audio-context suspend was fixed for, and
   the Android wrapper never pauses its WebView, so nothing else stops it. The
   clip is paused as the page hides and picked up again as the page is shown, so
   it sits exactly where it was left and nothing is decoded or played off
   screen. Only a clip this handler paused is resumed, so one the user paused
   himself stays paused, and a clip whose element was replaced or whose viewer
   was closed in the meantime is left alone. */
let viewPaused=null;
addEventListener('visibilitychange',()=>{
  if(document.hidden){
    const m=$('#vm').querySelector('video');
    if(m&&!m.paused){viewPaused=m;try{m.pause()}catch(e){}}
  }else if(viewPaused){
    const m=viewPaused;viewPaused=null;
    if(m.isConnected){const p=m.play();if(p&&p.catch)p.catch(()=>{})}
  }
});

/* ---------- opening animation ---------- */
function intro(){const st=$('#stage');spr(st,{s:.6,o:0},{s:1,o:1},{k:3});requestAnimationFrame(()=>requestAnimationFrame(()=>st.classList.add('open')));
  [['.top',-40,120],['#zoom',60,230],['#modes',70,320],['#thumb',80,400],['#shut',90,460],['#flip',80,520]]
   .forEach(([s,y,d])=>spr($(s),{s:.55,y,o:0},{s:1,y:0,o:1},{d}))}
moveInd(true);intro();start();
addEventListener('resize',()=>{stageRectCache=null;moveInd(true)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>moveInd(true)).catch(()=>{});
addEventListener('keydown',e=>{if(e.key==='Escape'&&openS)hideSheet()});

/* ---------- native save (Android app) ---------- */
if(window.AndroidCam){
  /* The save runs asynchronously — a fetch of the whole clip, then one bridge
     call per 512 KB slice — so the button stayed live for the second or more it
     takes to write a long take. A second tap in that window started a whole
     second save: another `AndroidCam.open()`, and two slice loops interleaving
     their writes into the stream the app already had open, so the gallery file
     came out at twice the clip's size with the halves interleaved, and two
     "Saved to your Gallery" toasts fired. The handler is now guarded: while a
     save is in flight further taps are ignored, and the flag is released in a
     `finally` so a failed or aborted save never leaves the button dead. */
  let saving=false;
  $('#vs').addEventListener('click',async e=>{
    const it=items[vi];e.preventDefault();
    if(saving||!it||!it.u)return;
    saving=true;
    let id=0;
    try{
      const res=await fetch(it.u);const bl=await res.blob();
      const mime=bl.type||(it.t==='v'?'video/mp4':'image/jpeg');
      const name='camera-'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+it.x;
      id=window.AndroidCam.open(mime,name);
      if(!id)throw new Error('open');
      /* Saving a take used to hand the bridge 3 MB slices. A @JavascriptInterface
         call does not return until the Java side has decoded the base64 and
         written the bytes, so every slice blocked the JS thread for the whole
         round trip — 3 MB becomes a 4 MB string, and the string delivery plus
         the decode/write left the UI frozen in long bursts. 512 KB slices cost
         the same total time (measured 612 ms vs 626 ms for a 21 MB clip) but the
         longest stall falls from 59 ms to 16 ms, and the yield between slices
         lets the toast and the shutter keep painting.
         The yield itself was `setTimeout(0)`, whose 4 ms nesting clamp makes
         every slice pay ~4.9 ms of pure idle (measured: 420 of them take
         2047 ms as timers against 25 ms as message tasks). A Max-quality take
         is 28 Mbps, so a 60 s clip is 420 slices and the clamp alone added
         ~2 s to its save — the save time grew with the length of the clip for
         no reason at all. Worse, a timer is throttled to one per second once
         the WebView is hidden, so a save the user backgrounded mid-way stalled
         for minutes; a message task is not throttled. yieldTask() hands the
         thread back the same way — a macrotask, so frames still paint between
         slices — without the clamp. */
      const CH=512*1024;let off=0;
      while(off<bl.size){
        const slice=bl.slice(off,Math.min(off+CH,bl.size));
        const b64=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]||'');fr.onerror=no;fr.readAsDataURL(slice)});
        if(window.AndroidCam.write(id,b64)!=='ok')throw new Error('write');
        off+=CH;
        if(off<bl.size)await yieldTask();
      }
      const done=window.AndroidCam.close(id);id=0;
      toast(done&&done.indexOf('ok')===0?'Saved to your Gallery':'Could not save ('+done+')');
    }catch(err){if(id){try{window.AndroidCam.abort(id)}catch(_){}}toast('Could not save this item')}
    finally{saving=false}
  });
}
</script>
</body>
